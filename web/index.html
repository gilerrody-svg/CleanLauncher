<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CleanDrive TS7 — Demo</title>
<style>
:root{--bg:#090e14;--panel:#111a24;--line:#263442;--muted:#91a1b2;--accent:#39d6bd;--white:#f4f7fa}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 75% 0%,#17313b 0,transparent 42%),var(--bg);color:var(--white);font:16px/1.4 system-ui,Segoe UI,sans-serif;min-height:100vh;display:grid;place-items:center;padding:22px}
.shell{width:min(1280px,100%);aspect-ratio:16/9;min-height:620px;max-height:calc(100vh - 44px);background:linear-gradient(135deg,#0d151e,#080d13);border:1px solid #30404c;border-radius:25px;padding:22px;display:grid;grid-template-rows:54px 1fr 76px;gap:16px;box-shadow:0 25px 90px #0009}
header,.bar{display:flex;align-items:center;justify-content:space-between}.brand{font-weight:800;letter-spacing:.14em}.brand span{color:var(--accent)}.status{color:var(--muted);display:flex;gap:18px;font-size:14px}.main{display:grid;grid-template-columns:1.1fr .9fr;gap:16px;min-height:0}.left{display:grid;grid-template-rows:1fr 1fr;gap:16px}.card{background:linear-gradient(145deg,#15212cdd,#0e1720);border:1px solid var(--line);border-radius:20px;padding:22px;min-height:0}.eyebrow{font-size:12px;color:var(--accent);letter-spacing:.18em;text-transform:uppercase}.clock{font-size:clamp(48px,7vw,86px);font-weight:300;letter-spacing:-.06em;margin:7px 0}.date{color:var(--muted)}.weather{display:flex;align-items:center;gap:18px;margin-top:18px}.weather .sun{font-size:42px}.temp{font-size:30px}.media{display:flex;align-items:center;gap:18px;margin-top:15px}.art{width:92px;height:92px;border-radius:16px;background:linear-gradient(135deg,#155d62,#1a283a);display:grid;place-items:center;font-size:36px}.track{font-weight:700;font-size:19px}.sub{color:var(--muted);font-size:13px;margin-top:5px}.controls{display:flex;gap:10px;margin-top:16px}.btn{border:1px solid var(--line);background:#1a2935;color:var(--white);border-radius:13px;padding:11px 16px;cursor:pointer}.btn:hover,.app:hover{border-color:var(--accent);transform:translateY(-2px)}.apps{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:18px}.app{background:#17232e;border:1px solid #293946;border-radius:16px;padding:17px;display:flex;align-items:center;gap:14px;cursor:pointer;transition:.15s;text-align:left;color:var(--white);font:inherit}.ico{font-size:27px;width:38px;text-align:center}.app small{display:block;color:var(--muted);font-size:12px;margin-top:3px}.right{display:grid;grid-template-rows:auto 1fr auto;gap:16px}.map{position:relative;overflow:hidden;min-height:260px;background:linear-gradient(35deg,#12242b,#17202b 60%,#1b2c31)}.map:before,.map:after{content:"";position:absolute;width:130%;height:55px;border:12px solid #34434a;border-left:0;border-right:0;transform:rotate(-27deg);top:40%;left:-15%;opacity:.8}.map:after{transform:rotate(38deg);top:54%;border-color:#293b43}.pin{position:absolute;z-index:2;left:53%;top:42%;font-size:34px}.maplabel{position:absolute;z-index:2;left:20px;top:18px}.quick{display:flex;justify-content:space-between;gap:10px}.quick .btn{flex:1}.dock{display:flex;align-items:center;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding-top:14px}.dock button{background:transparent;border:0;color:var(--muted);font-size:13px;cursor:pointer}.dock button.active{color:var(--accent)}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#eaf8f5;color:#10221f;padding:12px 20px;border-radius:30px;opacity:0;transition:.2s;pointer-events:none}.toast.show{opacity:1}
@media(max-width:760px){body{padding:8px}.shell{aspect-ratio:auto;max-height:none;min-height:100vh;border-radius:16px;padding:14px;grid-template-rows:auto 1fr auto}.status{gap:8px;font-size:11px}.main{grid-template-columns:1fr}.right{grid-template-rows:auto auto auto}.left{grid-template-rows:auto auto}.apps{grid-template-columns:repeat(2,1fr)}.card{padding:16px}.clock{font-size:58px}.dock{flex-wrap:wrap}}
</style></head>
<body><div class="shell">
<header><div class="brand">CLEAN<span>DRIVE</span> <small style="color:#8395a5;font-weight:500">TS7</small></div><div class="status"><span>● Conectado</span><span>Bluetooth</span><span>GPS</span><span id="topTime">--:--</span></div></header>
<main class="main"><section class="left">
<div class="card"><div class="eyebrow">Panel de conducción</div><div class="clock" id="clock">--:--</div><div class="date" id="date"></div><div class="weather"><div class="sun">☀️</div><div><div class="temp">28° <span style="font-size:15px;color:var(--muted)">Despejado</span></div><div class="sub">Clima de demostración · ubicación no conectada</div></div></div></div>
<div class="card"><div class="eyebrow">Reproduciendo ahora</div><div class="media"><div class="art">♫</div><div><div class="track" id="track">Tu música</div><div class="sub" id="artist">Selecciona reproducir para comenzar</div></div></div><div class="controls"><button class="btn" id="prev">◀◀</button><button class="btn" id="play">▶ Reproducir</button><button class="btn" id="next">▶▶</button></div></div>
</section><section class="right">
<div class="card"><div class="eyebrow">Accesos rápidos</div><div class="apps">
<button class="app" data-app="Navegación"><span class="ico">🧭</span><span>Maps<small>Navegación</small></span></button>
<button class="app" data-app="Radio FM"><span class="ico">📻</span><span>Radio FM<small>Emisoras favoritas</small></span></button>
<button class="app" data-app="Bluetooth"><span class="ico">ᛒ</span><span>Bluetooth<small>Teléfono y audio</small></span></button>
<button class="app" data-app="Aplicaciones"><span class="ico">▦</span><span>Aplicaciones<small>Todas tus apps</small></span></button>
</div></div>
<div class="card map"><div class="maplabel"><div class="eyebrow">Navegación</div><strong>Tu ruta comienza aquí</strong><div class="sub">Vista ilustrativa · GPS simulado</div></div><div class="pin">📍</div></div>
<div class="quick"><button class="btn" data-app="Ecualizador">♫ Ecualizador</button><button class="btn" data-app="Ajustes">⚙ Ajustes</button><button class="btn" data-app="Vehículo">🚘 Vehículo</button></div>
</section></main>
<nav class="dock"><button class="active" data-app="Inicio">⌂ Inicio</button><button data-app="Música">♫ Música</button><button data-app="Radio FM">◉ Radio</button><button data-app="Teléfono">▣ Teléfono</button><button data-app="Ajustes">⚙ Ajustes</button></nav>
</div><div class="toast" id="toast"></div>
<script>
const $=id=>document.getElementById(id);function tick(){const d=new Date();$('clock').textContent=d.toLocaleTimeString('es-EC',{hour:'2-digit',minute:'2-digit',hour12:false});$('topTime').textContent=d.toLocaleTimeString('es-EC',{hour:'2-digit',minute:'2-digit'});$('date').textContent=d.toLocaleDateString('es-EC',{weekday:'long',day:'numeric',month:'long',year:'numeric'});}tick();setInterval(tick,1000);
let playing=false,index=0;const tracks=[['Tu música','Biblioteca multimedia'],['Conduciendo de noche','Lista de reproducción'],['Favoritos','Audio local (demo)']];function render(){ $('track').textContent=tracks[index][0];$('artist').textContent=tracks[index][1];$('play').textContent=playing?'Ⅱ Pausar':'▶ Reproducir';} $('play').onclick=()=>{playing=!playing;render();notify(playing?'Reproducción simulada':'Pausa');};$('prev').onclick=()=>{index=(index+tracks.length-1)%tracks.length;render();};$('next').onclick=()=>{index=(index+1)%tracks.length;render();};render();
function notify(s){$('toast').textContent=s;$('toast').classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('toast').classList.remove('show'),1900);}
document.querySelectorAll('[data-app]').forEach(b=>b.addEventListener('click',()=>notify(b.dataset.app+': vista de demostración')));
</script></body></html>
