<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CleanDrive TS7</title>
<style>
:root{--accent:#aeb4bd;--blue:#777f89;--white:#f5f6f7;--muted:#b8bdc5;--dark:0}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#090a0c;color:var(--white);font:15px "Segoe UI",Arial,sans-serif;display:grid;place-items:center;padding:18px}
.launcher{width:min(1440px,100%);aspect-ratio:16/9;min-height:620px;max-height:calc(100vh - 36px);padding:18px 20px 10px;border-radius:24px;overflow:hidden;display:grid;grid-template-rows:1fr 76px;gap:12px;background:radial-gradient(ellipse at 12% 12%,#747b8650,transparent 38%),radial-gradient(ellipse at 92% 88%,#343a4355,transparent 42%),linear-gradient(130deg,#292d33,#171a1f 55%,#0d0f12);box-shadow:0 25px 80px #000b;border:1px solid #ffffff22}
.dashboard{display:grid;grid-template-columns:1.2fr 1fr 1.05fr;gap:14px;min-height:0}.column{display:flex;flex-direction:column;gap:12px;min-height:0}.card{border-radius:19px;border:1px solid #ffffff28;background:linear-gradient(160deg,#555c6538,#252a303d);box-shadow:0 8px 24px #09092222;overflow:hidden}.weather{flex:1;padding:24px 25px 18px;display:flex;flex-direction:column;background:linear-gradient(145deg,#626a74,#343a42 58%,#20242a)}.hello{font-size:clamp(23px,2.6vw,36px);font-weight:750;line-height:1.15}.greeting{font-size:16px;color:#ffffffd9;margin-top:6px}.car{flex:1;display:grid;place-items:center;min-height:100px;position:relative}.car svg{width:95%;height:100%;max-height:230px;filter:drop-shadow(0 14px 15px #09102d77)}.weatherline{display:flex;align-items:center;gap:13px}.weathericon{font-size:45px}.temp{font-size:48px;font-weight:300;line-height:1}.weatherdesc{font-size:15px}.city{font-size:12px;color:#ffffffc7;margin-top:4px}.weatherextra{margin-top:10px;align-self:flex-start;padding:7px 14px;border-radius:20px;background:#ffffff26;font-size:13px;color:white}
.clock{height:34%;min-height:145px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:10px}.time{font-size:clamp(38px,4vw,57px);font-weight:750;letter-spacing:-2px}.date{font-size:14px;color:#ffffffc9;margin-top:7px}.oil{margin-top:9px;border:0;border-radius:18px;padding:6px 13px;background:#ffffff24;color:white;font-size:12px;cursor:pointer}
.radio{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:14px}.radiohead{font-size:15px;font-weight:650;letter-spacing:.08em}.freqrow{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin:14px 0 2px}.freq{font-size:clamp(39px,4.3vw,60px);font-weight:750;letter-spacing:-2px}.unit{font-size:14px;color:#ffffffaa;align-self:flex-end;margin-bottom:11px}.round{width:46px;height:46px;border:0;border-radius:50%;background:#ffffff25;color:white;font-size:22px;cursor:pointer}.radio small{color:#ffffffa8}
.music{flex:1;position:relative;min-height:0;padding:15px;display:flex;flex-direction:column;justify-content:flex-end;background:linear-gradient(145deg,#555c65,#30353c 48%,#171a1f)}.music:before{content:"♫";position:absolute;inset:0;display:grid;place-items:center;font-size:clamp(110px,15vw,210px);font-weight:200;color:#ffffff20}.musiclabel{position:absolute;top:14px;left:14px;border-radius:15px;background:#0005;padding:5px 12px;font-size:11px;letter-spacing:.12em}.track{position:relative;font-size:20px;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.artist{position:relative;font-size:14px;color:#ffffffc9;margin-top:3px;margin-bottom:13px}.controls{position:relative;display:flex;align-items:center;justify-content:center;gap:17px}.control{border:0;border-radius:50%;width:45px;height:45px;background:#ffffff25;color:white;font-size:20px;cursor:pointer}.control.play{width:58px;height:58px;background:white;color:#34206e;font-size:22px}
.dock{border-top:1px solid #ffffff24;display:flex;align-items:center;justify-content:space-around;padding-top:7px}.dock button{border:0;background:transparent;color:#ffffffdf;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:65px;font-size:11px}.dock .ico{font-size:25px;line-height:1.2}.dock .apps .ico{width:56px;height:56px;border:2px solid #ffffffcc;border-radius:50%;display:grid;place-items:center;font-size:25px;box-shadow:0 0 0 5px #ffffff16}.dock button:hover{color:#ffffff;transform:translateY(-2px)}
.overlay{display:none;position:absolute;inset:0;background:#090a0cf2;z-index:5;padding:26px;border-radius:24px;overflow:auto}.overlay.open{display:block}.overlayhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.overlay h2{margin:0;font-size:25px}.close{background:#ffffff20;color:white;border:0;border-radius:12px;padding:9px 15px;cursor:pointer}.panel{background:#ffffff12;border:1px solid #ffffff24;border-radius:17px;padding:18px;margin-bottom:12px}.panel button,.preset{border:1px solid #ffffff35;border-radius:12px;background:#ffffff18;color:white;padding:10px 14px;cursor:pointer}.preset.active{background:#ffffff35;border-color:white}.appgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.app{border:1px solid #ffffff26;border-radius:15px;background:#ffffff12;color:white;padding:17px 8px;cursor:pointer;font:inherit}.app span{display:block;font-size:30px;margin-bottom:8px}.toast{position:absolute;bottom:90px;left:50%;transform:translateX(-50%);background:white;color:#241b4c;border-radius:24px;padding:10px 17px;display:none;z-index:9}.toast.show{display:block}
@media(max-width:850px){body{padding:0}.launcher{width:100%;min-height:100vh;max-height:none;aspect-ratio:auto;border-radius:0;padding:12px;grid-template-rows:1fr 68px}.dashboard{grid-template-columns:1fr 1fr;grid-template-rows:minmax(390px,1fr) minmax(390px,1fr);overflow:auto}.column:first-child{grid-row:span 2}.clock{min-height:120px}.weather{padding:18px}.dock button{min-width:38px}.dock button:not(.apps){font-size:0}.dock .ico{font-size:24px}.overlay{border-radius:0}.appgrid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:560px){.dashboard{grid-template-columns:1fr;grid-template-rows:480px 340px 340px}.column:first-child{grid-row:auto}.launcher{grid-template-rows:1fr 62px}.dock .ico{font-size:21px}.dock button{min-width:30px}}
</style></head><body><div class="launcher">
<main class="dashboard">
<section class="column"><div class="card weather"><div class="hello">¡Hola!</div><div class="greeting" id="greeting">Buenos días · Bienvenido</div><div class="car"><svg viewBox="0 0 500 220" role="img" aria-label="Ilustración de automóvil"><defs><linearGradient id="body" x2="0" y2="1"><stop stop-color="#f5f8ff"/><stop offset="1" stop-color="#8ea6d9"/></linearGradient><linearGradient id="glass" x2="0" y2="1"><stop stop-color="#385b9d"/><stop offset="1" stop-color="#182b54"/></linearGradient></defs><ellipse cx="250" cy="185" rx="190" ry="18" fill="#11183c" opacity=".35"/><path d="M72 145 L91 111 Q104 98 147 91 L190 48 Q207 33 239 32 L325 34 Q350 35 370 58 L415 111 Q444 119 450 145 L443 170 L57 170Z" fill="url(#body)" stroke="#dce8ff" stroke-width="4"/><path d="M157 91 L201 51 Q211 43 238 43 L267 43 L267 92Z M280 43 L322 45 Q342 46 357 66 L379 92 L280 92Z" fill="url(#glass)" stroke="#dce8ff" stroke-width="3"/><path d="M276 45 L276 94" stroke="#b9c8e8" stroke-width="4"/><path d="M91 119 Q160 108 250 110 Q356 108 423 121" fill="none" stroke="#7187b9" stroke-width="3"/><path d="M66 142 L104 137 L112 151 L68 155Z M399 137 L444 143 L439 157 L399 153Z" fill="#fff3bd"/><circle cx="145" cy="166" r="34" fill="#161b2c" stroke="#aab7d3" stroke-width="7"/><circle cx="145" cy="166" r="15" fill="#c8d2e7"/><circle cx="365" cy="166" r="34" fill="#161b2c" stroke="#aab7d3" stroke-width="7"/><circle cx="365" cy="166" r="15" fill="#c8d2e7"/></svg></div><div class="weatherline"><div class="weathericon">☀</div><div><div style="display:flex;align-items:baseline;gap:8px"><span class="temp">28°</span><span class="weatherdesc">Parcialmente nublado</span></div><div class="city">Clima de ejemplo · Ecuador</div></div></div><div class="weatherextra">↑ 30° &nbsp; ↓ 23° &nbsp; 💧 70% &nbsp; 8 km/h</div></div></section>
<section class="column"><div class="card clock"><div class="time" id="time">--:--</div><div class="date" id="date">Lunes, 3 de noviembre</div><button class="oil" onclick="toast('Mantenimiento del vehículo: demostración')">Aceite: configurar</button></div><div class="card radio"><div class="radiohead">◉ &nbsp; RADIO FM</div><div class="freqrow"><button class="round" onclick="tune(-0.1)">‹</button><div class="freq" id="freq">99.9</div><span class="unit">MHz</span><button class="round" onclick="tune(0.1)">›</button></div><small id="station">FM · Sintonizador de demostración</small></div></section>
<section class="column"><div class="card music"><div class="musiclabel" id="source">MÚSICA</div><div class="track" id="track">Nada sonando</div><div class="artist" id="artist">Toca para abrir la música</div><div class="controls"><button class="control" onclick="skip(-1)">‹‹</button><button class="control play" id="play" onclick="togglePlay()">▶</button><button class="control" onclick="skip(1)">››</button></div></div></section>
</main>
<nav class="dock">
<button onclick="openPanel('navigation')"><span class="ico">🧭</span>Mapa</button>
<button onclick="openPanel('bluetooth')"><span class="ico">ᛒ</span>Bluetooth</button>
<button onclick="openPanel('radio')"><span class="ico">◉</span>Radio</button>
<button class="apps" onclick="openPanel('apps')"><span class="ico">✣</span>Apps</button>
<button onclick="openPanel('screen')"><span class="ico">☾</span>Apagar</button>
<button onclick="openPanel('equalizer')"><span class="ico">♫</span>Audio</button>
<button onclick="openPanel('settings')"><span class="ico">⚙</span>Ajustes</button>
</nav>
<div class="overlay" id="overlay"><div class="overlayhead"><h2 id="panelTitle">Aplicaciones</h2><button class="close" onclick="closePanel()">✕ Cerrar</button></div><div id="panelContent"></div></div><div class="toast" id="toast"></div>
</div>
<script>
const overlay=document.getElementById('overlay'),panelTitle=document.getElementById('panelTitle'),panelContent=document.getElementById('panelContent');
function openPanel(id){overlay.classList.add('open');const titles={apps:'Aplicaciones',radio:'Radio FM',bluetooth:'Bluetooth',navigation:'Navegación',screen:'Pantalla',equalizer:'Ecualizador',settings:'Ajustes'};panelTitle.textContent=titles[id]||'CleanDrive';let html='';
if(id==='apps')html='<div class="appgrid">'+[['🧭','Maps','navigation'],['◉','Radio FM','radio'],['♫','Música','music'],['ᛒ','Bluetooth','bluetooth'],['☎','Teléfono','phone'],['🎚','Ecualizador','equalizer'],['🚘','Vehículo','vehicle'],['⚙','Ajustes','settings']].map(a=>'<button class="app" onclick="openPanel(\''+a[2]+'\')"><span>'+a[0]+'</span>'+a[1]+'</button>').join('')+'</div>';
else if(id==='radio')html='<div class="panel" style="text-align:center"><div style="font-size:58px" id="panelFreq">FM 99.9</div><p>Frecuencia simulada</p><button onclick="tune(-0.1)">− 0.1</button> <button onclick="tune(0.1)">+ 0.1</button><p>'+[88.5,92.3,99.9,104.5].map(n=>'<button class="preset" onclick="setFreq('+n+')">'+n+'</button>').join(' ')+'</p></div>';
else if(id==='bluetooth')html='<div class="panel"><h3>ᛒ Bluetooth</h3><p>Estado de conexión: demostración web.</p><button onclick="toast(\'El navegador no puede activar el Bluetooth del estéreo\')">Buscar dispositivos</button></div>';
else if(id==='navigation')html='<div class="panel"><h3>🧭 Navegación</h3><p>La aplicación Maps se abrirá desde el launcher instalado en Android. Esta vista web es solo una muestra.</p><button onclick="toast(\'GPS no disponible en la demostración web\')">Consultar ubicación</button></div>';
else if(id==='screen')html='<div class="panel"><h3>Pantalla</h3><p>La función de apagar pantalla requiere permisos de Android.</p><button onclick="toast(\'En la web no se puede apagar la pantalla del equipo\')">Apagar pantalla</button></div>';
else if(id==='equalizer')html='<div class="panel">'+['Bajos','Medios','Agudos','Balance'].map(x=>'<p>'+x+' <input type="range" min="0" max="100" value="50" style="width:70%"></p>').join('')+'<small>Controles visuales; no modifican el audio real.</small></div>';
else if(id==='settings')html='<div class="panel"><p>CleanDrive TS7 · Interfaz horizontal 1280 × 720</p><p>Android del equipo: 15.0 (informado por el usuario)</p><button onclick="toggleTheme()">Cambiar modo claro / oscuro</button></div>';
else html='<div class="appgrid"><button class="app" onclick="toast(\'Marcador de teléfono no disponible en navegador\')"><span>☎</span>Teléfono</button><button class="app" onclick="toast(\'Datos del vehículo no disponibles\')"><span>🚘</span>Vehículo</button></div>';
panelContent.innerHTML=html}
function closePanel(){overlay.classList.remove('open')}
function toast(s){let t=document.getElementById('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2400)}
let freq=99.9;function setFreq(n){freq=n;document.getElementById('freq').textContent=n.toFixed(1);let p=document.getElementById('panelFreq');if(p)p.textContent='FM '+n.toFixed(1);document.getElementById('station').textContent='FM · Frecuencia seleccionada'}function tune(n){setFreq(Math.max(87.5,Math.min(108,Math.round((freq+n)*10)/10)))}
let tracks=[['Nada sonando','Toca para abrir la música'],['Música de ejemplo','Biblioteca multimedia'],['Mi lista favorita','Reproducción simulada']],track=0,playing=false;function drawTrack(){document.getElementById('track').textContent=tracks[track][0];document.getElementById('artist').textContent=tracks[track][1];document.getElementById('play').textContent=playing?'Ⅱ':'▶'}function togglePlay(){playing=!playing;drawTrack();toast(playing?'Reproducción de muestra':'Pausado')}function skip(n){track=(track+n+tracks.length)%tracks.length;drawTrack()}
function tick(){let d=new Date();document.getElementById('time').textContent=d.toLocaleTimeString('es-EC',{hour:'2-digit',minute:'2-digit'});document.getElementById('date').textContent=d.toLocaleDateString('es-EC',{weekday:'long',day:'numeric',month:'long'});let h=d.getHours();document.getElementById('greeting').textContent=(h<12?'Buenos días':h<19?'Buenas tardes':'Buenas noches')+' · Bienvenido'}tick();setInterval(tick,1000);
let dark=false;function toggleTheme(){dark=!dark;document.querySelector('.launcher').style.filter=dark?'brightness(.65) saturate(.75)':'none';toast('Apariencia actualizada')}
</script></body></html>
